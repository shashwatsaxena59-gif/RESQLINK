<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1827" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="shadow512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Rounded Background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad512)" />
  <rect width="504" height="504" x="4" y="4" rx="100" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Outer Signal Waves -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#38bdf8" stroke-width="5" stroke-dasharray="10 14" opacity="0.4" />
  <circle cx="256" cy="256" r="144" fill="none" stroke="#38bdf8" stroke-width="6" opacity="0.6" />

  <!-- Shield Core -->
  <path d="M256 96 L360 144 C360 252 308 344 256 396 C204 344 152 252 152 144 Z"
        fill="url(#accentGrad512)" filter="url(#shadow512)" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" />

  <!-- Emergency Cross / Lifeline inside shield -->
  <rect x="236" y="166" width="40" height="128" rx="10" fill="#ffffff" />
  <rect x="192" y="210" width="128" height="40" rx="10" fill="#ffffff" />

  <!-- Beacon Center Pulse -->
  <circle cx="256" cy="230" r="12" fill="#ef4444" />

  <!-- Offline Connectivity Nodes -->
  <circle cx="256" cy="438" r="14" fill="#10b981" />
  <circle cx="214" cy="438" r="8" fill="#38bdf8" opacity="0.8" />
  <circle cx="298" cy="438" r="8" fill="#38bdf8" opacity="0.8" />
  <line x1="222" y1="438" x2="242" y2="438" stroke="#38bdf8" stroke-width="4" stroke-dasharray="4 4" />
  <line x1="270" y1="438" x2="290" y2="438" stroke="#38bdf8" stroke-width="4" stroke-dasharray="4 4" />
</svg>
