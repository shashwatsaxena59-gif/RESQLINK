<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1827" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Rounded Background -->
  <rect width="192" height="192" rx="40" fill="url(#bgGrad)" />
  <rect width="188" height="188" x="2" y="2" rx="38" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Outer Signal Waves -->
  <circle cx="96" cy="96" r="68" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 6" opacity="0.4" />
  <circle cx="96" cy="96" r="54" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.6" />

  <!-- Shield Core -->
  <path d="M96 36 L136 54 C136 94 116 128 96 148 C76 128 56 94 56 54 Z"
        fill="url(#accentGrad)" filter="url(#shadow)" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />

  <!-- Emergency Cross / Lifeline inside shield -->
  <!-- Cross vertical -->
  <rect x="88" y="62" width="16" height="48" rx="4" fill="#ffffff" />
  <!-- Cross horizontal -->
  <rect x="72" y="78" width="48" height="16" rx="4" fill="#ffffff" />

  <!-- Beacon Center Pulse -->
  <circle cx="96" cy="86" r="5" fill="#ef4444" />

  <!-- Offline Connectivity Node Indicator -->
  <circle cx="96" cy="164" r="5" fill="#10b981" />
  <circle cx="80" cy="164" r="3" fill="#38bdf8" opacity="0.8" />
  <circle cx="112" cy="164" r="3" fill="#38bdf8" opacity="0.8" />
  <line x1="83" y1="164" x2="91" y2="164" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2" />
  <line x1="101" y1="164" x2="109" y2="164" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2" />
</svg>
